<!DOCTYPE html>
<html>

<head>
    <title>Live Stones</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/5.0.11/signalr.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include fflate.min.js -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/libs/fflate.min.js"></script>
    <!-- Include FBXLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/FBXLoader.js"></script>
    <!-- Include OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    

</head>
<body>


    <script src="js/curlit.three.js"></script>

    <script src="js/stones.sse.js"></script>


    <div id="controls" style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    ">
        <div id="info" style="font-size: 12px;
        position: absolute;
        left: 0;
        padding: 3px;">
            <b>End:</b> <span class="end"></span><br/>
            <b>Stone:</b> <span class="stone"></span><br/>
            <b>Team:</b> <span class="team"></span><br/>
            <b>Player:</b> <span class="player"></span><br/>
            <b>Points:</b> <span class="points"></span><br/>
        </div>

        <!-- Navigation Buttons -->
        <button id="firstScene" style="margin: 0 10px; padding: 5px 10px;">
            << Prev</button>
                <button id="backScene" style="margin: 0 10px; padding: 5px 10px;">
                    < Back</button>
                        <button id="3dScene" style="margin: 0 10px; padding: 5px 10px;"> 3D</button>
                        <button id="nextScene" style="margin: 0 10px; padding: 5px 10px;"">Next ></button>
                        <button id="lastScene" style="margin: 0 10px; padding: 5px 10px;">Last >></button>
    </div>

    <div id="viewport">
    </div>
</body>

</html>
