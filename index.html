<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
  <title>Live Scores</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/5.0.11/signalr.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <link rel="stylesheet" type="text/css" href="css/livestones.css">
  <link rel="stylesheet" type="text/css" href="css/livescores.css">
  <link id="scoretheme" rel="stylesheet" type="text/css" href="css/livescores_blue.css">
  <script src="js/livestones.js"></script>

  <!-- 3d integration -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Include fflate.min.js -->
  <script src="https://cdn.jsdelivr.net/npm/three/examples/js/libs/fflate.min.js"></script>
  <!-- Include FBXLoader -->
  <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/FBXLoader.js"></script>
  <!-- Include OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    

  <!-- livescores.worldcurling integration -->
  <link rel="stylesheet" type="text/css" href="https://livescores.worldcurling.org/pg/CSS/curlit.css">
  <link id="csstheme" rel="stylesheet" type="text/css" href="https://livescores.worldcurling.org/pg/CSS/blue.css">
  <link id="cssextra" rel="stylesheet" type="text/css" href="css/livestones_blue.css">
  <style type="text/css">
    body {
      max-width: 100%;
    }

    input {
      padding: 1px 1px 1px 1px;
    }
  </style>
</head>

<body>





  <form id="form1">
    <div style="width:100%;">

      <table style="width: 100%" border="0">
        <tbody>
          <tr>
            <td>
              <div class="menu1" data-bs-theme="auto">
                <a href="#Menu2_SkipLink"
                  style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">Skip Navigation
                  Links</a>
                <div style="clear: left;"></div><a id="Menu2_SkipLink"></a>

              </div>
            </td>

          </tr>
          <tr>
            <td valign="top" colspan="3" align="left" class="favTeam">
              &nbsp;
              <span id="LabelEventPlace" class="sl">Test Event 2025 North Vancouver,
                Canada</span>
            </td>
          </tr>
          <tr>
            <td valign="middle" align="left" class="favTeam">
              <input type="submit" name="ctl00$btnBack" value=" &lt; "
                onclick="JavaScript:window.history.back(1); return false;" id="btnBack">
            </td>
            <td valign="top" align="left" class="favTeam">
              <input type="image" name="ctl00$RefreshButton" id="RefreshButton" title="reload and update"
                class="bigIcon" src="https://livescores.worldcurling.org/general/online.png" alt="refresh" align="top">
              &nbsp;
            </td>
            <td valign="top" align="right" class="favTeam">

              <input type="image" name="ctl00$ScreenshotButton" id="ScreenshotButton" title="Set layout for Screenshot"
                class="bigIcon" src="https://livescores.worldcurling.org/general/camera.svg"
                alt="Set layout for Screenshot" align="bottom"> &nbsp;
            </td>
          </tr>
          <tr>
            <td colspan="3" style="width: 100%" valign="top">
              <section class="content-wrapper main-content clear-fix">

                
                <div id="scoreboard" class="container-wide tile-l">
                  <div id="session-header" class="offline"></div>
                  <div id="loader">&nbsp;</div>
                  <!-- Running -->
                  <div id="game-tile" class="row">
                    <!-- Matchup Tile -->
                    <div class="col-12">
                      <div class="matchup-tile tile-l">
                        <header>
                          <div class="header-content">
                            <!-- <span class="sheet"></span> -->
                            <div class="select-wrapper" style="margin-left: 2px;">
                              <select title="sheet" name="sheet" class="sheet">
                              </select>
                            </div>

                            <span class="left-text"></span>

                            <!-- Middle Text: "SCHEDULED" -->
                            <span class="middle-text"></span>

                            <!-- Right Text: "Gold Medal Game" and Buttons -->
                            <div class="d-flex justify-content-end align-items-center right-area">
                              <span class="me-1"></span>
                              <div class="d-flex"></div>
                            </div>
                          </div>
                        </header>
                        <div class="dynamic-content">
                          <!-- For small screens -->
                          <div class="col-12">
                            <div class="d-flex justify-content-between">
                              <div class="summary">
                                <div class="home">
                                  <img class="flag" src="">
                                  <span class="team-name"></span>
                                  <span class="score"></span>
                                  <span class="team-history"></span>
                                  <span class="team-clock"></span>
                                </div>
                                <span class="separator">-</span>
                                <div class="away">
                                  <span class="score"></span>
                                  <span class="team-name"></span>
                                  <img class="flag" src="">
                                  <span class="team-history"></span>
                                  <span class="team-clock"></span>
                                  <!-- <span class="team-clock timeout active">38:00</span> -->
                                </div>
                              </div>
                            </div>


                            <table class="scoreboard game-center">
                              <thead>
                              </thead>
                              <tbody>
                                  <tr>
                                  </tr>
                                  <tr>
                                  </tr>
                              </tbody>
                          </table>


                            <!-- Game center -->
                            <div id="game-center">
                              <div id="top-stats">
                                <div id="head-to-head">
                                  <div class="headers">
                                    <div class="headers-slider">
                                    </div>
                                  </div>
                                  <button type="button" class="header-arrow header-prev">&lt;</button>
                                  <button type="button" class="header-arrow header-next">&gt;</button>

                                  <div class="team-left"></div>
                                  <div class="team-right"></div>

                                  <div class="stats-container">
                                    <div class="stat-row-template" data-left="0" data-right="0">
                                      <div class="label"></div>
                                      <div class="text-line">
                                        <div class="info-left"></div>
                                        <div class="text-left"></div>
                                        <div class="text-right"></div>
                                        <div class="info-right"></div>
                                      </div>
                                      <div class="bar-line">
                                        <div class="value-left"></div>
                                        <div class="count-left"></div>
                                        <div class="mirror-bar">
                                          <div class="label-left"></div>
                                          <div class="bar-left"></div>
                                          <div class="bar-right"></div>
                                          <div class="label-right"></div>
                                        </div>
                                        <div class="count-right"></div>
                                        <div class="value-right"></div>
                                      </div>
                                    </div>
                                  </div>
                                  <div class="swipe-feedback left"></div>
                                  <div class="swipe-feedback right"></div>
                                
                                  <div class="index-buttons" id="indexButtonsStats"></div>
                                </div>
                              </div>



                              <!-- Game content -->
                              <div id="game-content">
                                <div class="slider-wrapper">
                                  <div class="slider" id="slider"></div>

                                  <!-- arrows -->
                                  <button onclick="return false;" id="arrowPrev"
                                    class="nav-arrow left">&#10094;</button>
                                  <button onclick="return false;" id="arrowNext"
                                    class="nav-arrow right">&#10095;</button>

                                  <div class="index-buttons" id="indexButtons"></div>
                                </div>

                                <div id="viewport3d">
                                </div>

                                <div id="currentShot">

                                  <div class="shotInfo">
                                    <!-- End/Stone -->
                                    <table class="endstone">
                                      <tr>
                                        <td>
                                          <div class="select-wrapper">
                                            <select title="ends" name="ends" class="current-end"> </select>
                                          </div>
                                        </td>
                                        <td>
                                          <div class="select-wrapper" style="margin-left: 2px;">
                                            <select title="stones" name="stones" class="current-stone"> </select>
                                          </div>
                                        </td>
                                      </tr>
                                    </table>

                                    <!-- Competitor -->
                                    <table class="competitor">
                                      <tr>
                                        <td class="flag" rowspan="2">
                                          <img alt="" class="flag" src="">
                                        </td>
                                        <td>
                                          <span class="lastname"></span>
                                        </td>
                                      </tr>
                                      <tr>
                                        <td>
                                          <span class="firstname"></span>
                                        </td>
                                      </tr>
                                    </table>

                                    <!-- Shot details -->
                                    <table class="shot-details">
                                      <tr>
                                        <td>
                                          <span class="type"></span>
                                        </td>
                                      </tr>
                                      <tr>
                                        <td>
                                          <span class="handle"></span>
                                          <span class="accuracy"></span>
                                        </td>
                                      </tr>
                                      <tr>
                                        <td>
                                          <span class="comment"></span>
                                        </td>
                                      </tr>
                                    </table>



                                  </div>


                                  <!-- Action Buttons -->
                                  <div class="commands">
                                    <div class="command">
                                      <div class="col">Scoreboard</div>
                                      <div class="col">
                                        <label class="switch">
                                          <input type="checkbox" id="is_scb">
                                          <span class="btn-slider round" data-target="scoreboard"></span>
                                        </label>
                                      </div>
                                    </div>
                                    <div class="command">
                                      <div class="col">Stats</div>
                                      <div class="col">
                                        <label class="switch">
                                          <input type="checkbox" id="is_stats">
                                          <span class="btn-slider round" data-target="stats"></span>
                                        </label>
                                      </div>
                                    </div>
                                    <div class="command expand">
                                      <div class="col">Follow Live</div>
                                      <div class="col">
                                        <label class="switch">
                                          <input type="checkbox" checked id="is_live">
                                          <span class="btn-slider round" data-target="live"></span>
                                        </label>
                                      </div>
                                    </div>
                                  </div>
                                </div>

                              </div>
                            </div>


                          </div>


                        </div>
                      </div>
                    </div>
                  </div>

              </section>

            </td>
          </tr>
          <tr>
            <td valign="middle" class="favTeam" style="white-space: nowrap;">
            </td>
            <td valign="middle" class="favTeam" align="center" style="font-size:x-small;">

              <div id="viewSwitcher">
                Mobile view | <a
                  href="/wjcc/__FriendlyUrls_SwitchView?ReturnUrl=%2fwjcc%2faspnet%2flivescores%3fEventID%3d0"
                  data-ajax="false">Switch to Desktop</a>
              </div>
            </td>
            <td valign="middle" class="favTeam" style="white-space: nowrap;" align="right">
              <input type="button" name="ctl00$bfbblue" value="BW" id="bfbblue"
                title="Set color scheme to blue background with white font color" class="xsbtnBlue">
              <input type="button" name="ctl00$bfbwhite" value="WB" id="bfbwhite"
                title="Set color scheme to white background with dark blue font color" class="xsbtnWhite">
              <input type="button" name="ctl00$bfbbig" value="BIG" id="bfbbig"
                title="Set color scheme to white background, using big black fonts (improving accessibility for people with low Vision)"
                class="xsbtnBig">&nbsp;&nbsp;

            </td>
          </tr>
          <tr>
            <td colspan="3" valign="top" class="xxsc">
            </td>
          </tr>
          <tr>
            <td colspan="3" valign="top" class="xxsc">
              <img id="ImageWCFCURLIT" class="imgWCFCURLIT"
                src="https://livescores.worldcurling.org/general/WCF_CURLIT.png"
                alt="World Curling and CURLIT"><br>&nbsp;<br>
              © 2025
              <span id="lCopyright" visble="false">World Curling and CURLIT Ltd., all rights reserved</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </form>


</body>

</html>
